[package]
name = "showcase"
edition = "2024"
publish = false

[dependencies]
js-sys = "0.3.77"
plinth = { path = ".." }
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.50"
web-sys = { version = "0.3.77", features = ["CssStyleDeclaration", "Document", "DomRect", "DomTokenList", "Element", "Event", "EventInit", "HtmlCollection", "HtmlElement", "HtmlInputElement", "HtmlOptionElement", "HtmlSelectElement", "Location", "NodeList", "Window"] }
yew = { version = "0.23.0", features = ["csr"] }

[build-dependencies]
plinth-build = { path = "../plinth-build" }
