[package]
name = "plinth"
edition = "2024"
publish = false

[dependencies]
wasm-bindgen = "0.2.100"
web-sys = { version = "0.3.77", features = ["AddEventListenerOptions", "Document", "DomRect", "DomTokenList", "Element", "Event", "EventTarget", "FocusOptions", "HtmlCollection", "HtmlElement", "HtmlHeadElement", "HtmlInputElement", "HtmlTextAreaElement", "KeyboardEvent", "Node", "NodeList", "PointerEvent", "ResizeObserver", "Window"] }
yew = "0.23.0"

[build-dependencies]
plinth-build = { path = "plinth-build" }

[dev-dependencies]
futures = "0.3"
plinth-build = { path = "plinth-build" }
yew = { version = "0.23.0", features = ["ssr"] }

[workspace]
resolver = "3"
members = [".", "plinth-build", "plinth-build/fixture", "showcase"]
exclude = [".claude"]
