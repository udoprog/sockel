[package]
name = "sockel"
version = "0.1.0"
edition = "2024"
description = "Opinionated layout primitives and components for Yew apps that keep their size as their content changes."
readme = "README.md"
license = "MIT OR Apache-2.0"
include = ["/build.rs", "/locales", "/src", "/style", "/README.md"]
links = "sockel"
publish = false

[package.metadata.trug]
dir = "style"
entry = "_index.scss"

[package.metadata.trug.gate]
actions = "action-group"
badges = "badge"
buttons = "button"
card-grid = "card-grid"
color-select = "color-select"
confirm = "confirm"
dialog = "overlay"
disclosure = "disclosure"
drop = "drop-zone"
fields = "field"
filter-picker = "picker"
heads = "head"
icons = "icons"
inputs = "input"
layout = "layout"
listbox = "select"
media = "media"
menu = "menu"
notices = "notice"
pager = "pager"
panel = "panel"
picker = "picker"
popover = "overlay"
reorder = "reorder"
rows = "rows"
seam = "seam"
search-select = "search-select"
select = "select"
shell = "shell"
skeleton = "skeleton"
split-view = "split-view"
stepper = "stepper"
table = "table"
tabs = "tabs"
toast = "toast"
toggles = "toggles"
tooltip = "tooltip"

[features]
default = ["full"]
full = ["action-group", "badge", "button", "card-grid", "color-select", "confirm", "disclosure", "drop-zone", "field", "head", "icons", "input", "layout", "library-toolbar", "loadable", "media", "menu", "notice", "overlay", "pager", "panel", "picker", "reorder", "rows", "search-select", "seam", "select", "shell", "skeleton", "split-view", "stepper", "table", "tabs", "toast", "toggles", "tooltip"]
action-group = []
badge = ["icons"]
button = ["icons", "skeleton"]
card-grid = []
color-select = ["select"]
confirm = ["action-group", "badge", "button", "notice", "overlay"]
disclosure = ["head", "icons"]
drop-zone = ["button"]
field = []
head = ["layout"]
icons = []
input = ["icons"]
layout = []
library-toolbar = ["input", "layout"]
loadable = ["notice", "skeleton"]
media = ["icons"]
menu = ["button", "icons", "overlay"]
notice = ["badge", "button"]
overlay = ["action-group", "button", "head", "icons"]
pager = ["icons"]
panel = []
picker = ["overlay", "pager", "select"]
reorder = ["icons", "rows", "tooltip"]
rows = ["button"]
search-select = ["select"]
seam = []
select = ["input", "menu", "tooltip"]
shell = ["badge"]
skeleton = ["icons", "media"]
split-view = ["seam"]
stepper = ["input"]
table = ["icons"]
tabs = []
toast = ["badge", "button", "overlay"]
toggles = ["icons"]
tooltip = ["overlay"]

[dependencies]
phrasebook02 = { package = "phrasebook", version = "0.2.0", features = ["yew023"] }
phrasebookcatalog01 = { package = "phrasebook-catalog", version = "0.1.0" }
wasm-bindgen = "0.2.100"
web-sys = { version = "0.3.77", features = ["AddEventListenerOptions", "BeforeUnloadEvent", "Blob", "console", "Clipboard", "ClipboardEvent", "CssStyleDeclaration", "DataTransfer", "DataTransferItem", "DataTransferItemList", "Document", "DomRect", "DomRectList", "DomTokenList", "DragEvent", "Element", "Event", "EventTarget", "File", "FileList", "FocusOptions", "HtmlCollection", "HtmlElement", "HtmlHeadElement", "HtmlInputElement", "HtmlTextAreaElement", "KeyboardEvent", "Navigator", "Node", "NodeList", "PointerEvent", "ResizeObserver", "ResizeObserverEntry", "ResizeObserverSize", "ScrollIntoViewOptions", "ScrollLogicalPosition", "Window"] }
yew = "0.23.0"

[build-dependencies]
sockel-build = { version = "0.1.0", path = "sockel-build" }

[dev-dependencies]
futures = "0.3"
sockel-build = { version = "0.1.0", path = "sockel-build" }
yew = { version = "0.23.0", features = ["ssr"] }

[workspace]
resolver = "3"
members = [".", "sockel-build", "sockel-build/fixture", "showcase"]
exclude = [".claude"]

[patch.crates-io]
sockel = { path = "." }
sockel-build = { path = "sockel-build" }
