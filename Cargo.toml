[package]
name = "sockel"
version = "0.4.0"
authors = ["John-John Tedro <udoprog@tedro.se>"]
edition = "2024"
description = "Yew components that keep their size as their content and state change, each shipped with its Sass, so an app's pages never jitter."
documentation = "https://docs.rs/sockel"
readme = "README.md"
homepage = "https://udoprog.github.io/sockel/"
repository = "https://github.com/udoprog/sockel"
license = "MIT OR Apache-2.0"
keywords = ["components", "css", "ui", "wasm", "yew"]
categories = ["gui", "wasm", "web-programming"]
include = ["/build.rs", "/locales", "/src", "/style", "/tests", "/README.md"]
links = "sockel"

[package.metadata.trug]
dir = "style"
entry = "_index.scss"

[package.metadata.trug.gate]
actions = "action-group"
badges = "badge"
buttons = "button"
checkbox = "checkbox"
chip = "chip"
choice = "choice"
card-grid = "card-grid"
code-editor = "code-editor"
code-snippet = "code-snippet"
color-select = "color-select"
composer = "composer"
confirm = "confirm"
dialog = "overlay"
disclosure = "disclosure"
drop = "drop-zone"
fields = "field"
file-browser = "file-browser"
filter-picker = "picker"
heads = "head"
icons = "icons"
inputs = "input"
lanes = "lanes"
layout = "layout"
lightbox = "lightbox"
listbox = "select"
log-view = "log-view"
media = "media"
menu = "menu"
notices = "notice"
pager = "pager"
panel = "panel"
picker = "picker"
popover = "overlay"
property-list = "property-list"
quantity = "quantity"
reorder = "reorder"
rows = "rows"
save-bar = "save-bar"
seam = "seam"
shortcuts = "shortcuts"
search-select = "search-select"
select = "select"
shell = "shell"
skeleton = "skeleton"
split-view = "split-view"
stepper = "stepper"
switch = "switch"
table = "table"
tabs = "tabs"
time = "time"
toast = "toast"
toasts = "toasts"
toggles = "toggles"
tooltip = "tooltip"

[package.metadata.sockel.features]
full = "Every feature below; the default."
action-group = "`ActionGroup`: the buttons that end a form, a panel or a section, the primary first."
badge = "Short marks of a fixed size: `Pill`, `Badge`, `Dot`, `Count` and `StatusLabel`."
button = "`Button` and `IconButton`, with sizes, variants and a busy state that keeps the width."
card-grid = "`CardGrid`: cards in columns of one width, as many as fit."
checkbox = "`Checkbox` and `OptionCard`."
chip = "`Chip`, `ChipToggle` and `ChipList`."
chip-select = "`ChipSelect`: removable chips of what is picked, over a `SearchSelect`."
choice = "`Choice`: a segmented choice among a few options."
code-editor = "`CodeEditor`: a code editor that knows no language, with diagnostics and completions."
code-snippet = "`CodeSnippet`: code shown as written, highlighted by the app's spans."
color-select = "`ColorSelect`: a swatch opening a grid of the app's colours."
composer = "`Composer`: a message's box at the foot of a conversation."
confirm = "`Confirm`, `ConfirmPopover`, `ConfirmButton`, `ConfirmInline` and `ConfirmHost`."
disclosure = "`Disclosure`: a summary that opens on its details."
drop-zone = "`DropZone`: where files are dropped or picked."
field = "`Field`, `FormRows` and `Fieldset`: a control's label, hint and error."
file-browser = "`FileBrowser`: a dialog choosing a path the app lists."
head = "`PageHead` and `SectionHead`."
icons = "The icons of sockel's own chrome, and the `IconSet` an app replaces them with."
input = "`TextInput`, `Textarea`, `SearchField`, `SecretInput` and `InputGroup`."
lanes = "`Lanes`: lists side by side whose rows move within and between them."
layout = "`Stack`, `Cluster`, `Toolbar` and `Card`: the layout primitives."
library-toolbar = "`LibraryToolbar`: a list's search, filters and actions in one bar."
lightbox = "`Lightbox`: a full-screen viewer of a set of images."
loadable = "`Loadable`: a skeleton while loading, an error or the content."
log-view = "`LogView` and `LogGroup`: an append-only scroll that follows its end."
media = "`Image` and `Avatar`, in a box sized before they load."
menu = "`Menu`, its items, `RowActions`, `SplitButton` and `ContextMenu`."
notice = "`Notice`, `EmptyState` and `ErrorBox`."
overlay = "The overlay layer: `OverlayHost`, `Popover` and `Dialog`."
pager = "`Pager`: pages of a list, its slots of one width."
panel = "`Panel`: a bordered ground over a list or a view."
picker = "`Picker`, `PickerMenu`, `PickerDialog`, `ChoiceList` and `FilterPicker`."
property-list = "`PropertyList`, `PropertyRow` and `InlineEdit`: an entity's fields as label and value."
quantity = "`QuantityField`: a number and its unit."
reorder = "`Reorder`, `ReorderTree` and `DragHandle`: rows moved by pointer and keyboard."
rows = "`RowList`, `PickRow`, `SelectionBar` and `ActionRow`."
save-bar = "`SaveBar` and the unload guard."
search-select = "`SearchSelect`: a text field filtering a list of options."
seam = "`Seam`: two panes and the divider dragged between them."
select = "`Select` and the `Listbox` it opens."
shell = "`AppShell` and `BottomNav`: an app's frame."
shortcuts = "`Shortcut`, `Kbd` and `ShortcutHelp`: keys an app binds, scoped by the active overlay."
skeleton = "`Skeleton` and `Spinner`."
split-view = "`SplitView`: a list and the detail opened from it."
stepper = "`Stepper`: a number stepped up and down."
switch = "`Switch`."
table = "`Table`, `TableRow`, `TableCell` and `SortHeader`."
tabs = "`Tabs`, `SubTabs`, `LinkTabs` and `NavList`."
time = "`Time`: a moment said relative to now or as a date."
toast = "`toasts` and `save-bar` together, as the `toast` partial has always loaded them."
toasts = "`Toast` and `ToastHost`."
toggles = "`checkbox`, `chip`, `choice` and `switch` together."
tooltip = "`Tooltip`, `HoverCard` and `ReasonButton`."

[features]
default = ["full"]
full = ["action-group", "badge", "button", "card-grid", "checkbox", "chip", "chip-select", "choice", "code-editor", "code-snippet", "color-select", "composer", "confirm", "disclosure", "drop-zone", "field", "file-browser", "head", "icons", "input", "lanes", "layout", "library-toolbar", "lightbox", "loadable", "log-view", "media", "menu", "notice", "overlay", "pager", "panel", "picker", "property-list", "quantity", "reorder", "rows", "save-bar", "seam", "search-select", "select", "shell", "shortcuts", "skeleton", "split-view", "stepper", "switch", "table", "tabs", "time", "toast", "toasts", "toggles", "tooltip"]
action-group = []
badge = ["icons"]
button = ["icons", "skeleton"]
card-grid = []
checkbox = ["icons"]
chip = ["icons"]
chip-select = ["chip", "layout", "search-select"]
choice = []
code-editor = ["code-snippet", "overlay", "select"]
code-snippet = []
color-select = ["select"]
composer = ["drop-zone", "input"]
confirm = ["action-group", "badge", "button", "notice", "overlay"]
disclosure = ["head", "icons"]
drop-zone = ["button"]
field = []
file-browser = ["badge", "button", "confirm", "field", "icons", "input", "layout", "notice", "overlay", "rows", "tabs"]
head = ["layout"]
icons = []
input = ["icons"]
lanes = ["badge", "reorder"]
layout = []
library-toolbar = ["input", "layout"]
lightbox = ["overlay"]
loadable = ["notice", "skeleton"]
log-view = ["button"]
media = ["icons"]
menu = ["button", "icons", "overlay"]
notice = ["badge", "button"]
overlay = ["action-group", "button", "head", "icons"]
pager = ["icons"]
panel = []
picker = ["overlay", "pager", "select"]
property-list = ["button", "input"]
quantity = ["select", "stepper"]
reorder = ["icons", "rows", "tooltip"]
rows = ["button"]
save-bar = ["button"]
search-select = ["select"]
seam = []
select = ["input", "menu", "tooltip"]
shell = ["badge"]
shortcuts = ["overlay"]
skeleton = ["icons", "media"]
split-view = ["seam"]
stepper = ["input"]
switch = ["icons"]
table = ["icons"]
tabs = []
time = []
toast = ["save-bar", "toasts"]
toasts = ["badge", "button", "overlay"]
toggles = ["checkbox", "chip", "choice", "switch"]
tooltip = ["overlay"]

[dependencies]
js-sys = "0.3.77"
phrasebook02 = { package = "phrasebook", version = "0.2.0", features = ["yew023"] }
phrasebookcatalog01 = { package = "phrasebook-catalog", version = "0.1.0" }
wasm-bindgen = "0.2.100"
web-sys = { version = "0.3.77", features = ["AddEventListenerOptions", "BeforeUnloadEvent", "Blob", "console", "Clipboard", "ClipboardEvent", "CssStyleDeclaration", "DataTransfer", "DataTransferItem", "DataTransferItemList", "Document", "DomRect", "DomRectList", "DomTokenList", "DragEvent", "Element", "Event", "EventTarget", "File", "FileList", "FocusOptions", "HtmlCollection", "HtmlDocument", "HtmlElement", "HtmlHeadElement", "HtmlInputElement", "HtmlTextAreaElement", "InputEvent", "KeyboardEvent", "Navigator", "Node", "NodeList", "PointerEvent", "ResizeObserver", "ResizeObserverEntry", "ResizeObserverSize", "ScrollIntoViewOptions", "ScrollLogicalPosition", "Window"] }
yew = "0.23.0"

[build-dependencies]
sockel-build = { version = "0.4.0", path = "sockel-build" }

[dev-dependencies]
futures = "0.3"
sockel-build = { version = "0.4.0", path = "sockel-build" }
yew = { version = "0.23.0", features = ["ssr"] }

[workspace]
resolver = "3"
members = [".", "sockel-build", "sockel-build/fixture", "showcase"]
exclude = [".claude"]

[patch.crates-io]
sockel = { path = "." }
sockel-build = { path = "sockel-build" }
