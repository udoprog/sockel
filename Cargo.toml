[package]
name = "plinth"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
wasm-bindgen = "0.2.100"
web-sys = { version = "0.3.77", features = ["AddEventListenerOptions", "BeforeUnloadEvent", "Blob", "console", "Clipboard", "ClipboardEvent", "CssStyleDeclaration", "DataTransfer", "DataTransferItem", "DataTransferItemList", "Document", "DomRect", "DomRectList", "DomTokenList", "DragEvent", "Element", "Event", "EventTarget", "File", "FileList", "FocusOptions", "HtmlCollection", "HtmlElement", "HtmlHeadElement", "HtmlInputElement", "HtmlTextAreaElement", "KeyboardEvent", "Navigator", "Node", "NodeList", "PointerEvent", "ResizeObserver", "ResizeObserverEntry", "ResizeObserverSize", "ScrollIntoViewOptions", "ScrollLogicalPosition", "Window"] }
yew = "0.23.0"

[build-dependencies]
plinth-build = { path = "plinth-build" }

[dev-dependencies]
futures = "0.3"
plinth-build = { path = "plinth-build" }
yew = { version = "0.23.0", features = ["ssr"] }

[workspace]
resolver = "3"
members = [".", "plinth-build", "plinth-build/fixture", "showcase"]
exclude = [".claude"]
