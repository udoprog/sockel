[package]
name = "plinth"
edition = "2024"
publish = false

[dependencies]
web-sys = { version = "0.3.77", features = ["Document", "Element", "HtmlHeadElement", "HtmlInputElement", "Node", "Window"] }
yew = "0.23.0"

[build-dependencies]
plinth-build = { path = "plinth-build" }

[dev-dependencies]
futures = "0.3"
plinth-build = { path = "plinth-build" }
yew = { version = "0.23.0", features = ["ssr"] }

[workspace]
resolver = "3"
members = [".", "plinth-build", "plinth-build/fixture", "showcase"]
exclude = [".claude"]
