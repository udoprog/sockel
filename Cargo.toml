[package]
name = "sockel"
version = "0.3.2"
authors = ["John-John Tedro <udoprog@tedro.se>"]
edition = "2024"
description = "Yew components that keep their size as their content and state change, each shipped with its Sass, so an app's pages never jitter."
documentation = "https://docs.rs/sockel"
readme = "README.md"
homepage = "https://udoprog.github.io/sockel/"
repository = "https://github.com/udoprog/sockel"
license = "MIT OR Apache-2.0"
keywords = ["components", "css", "ui", "wasm", "yew"]
categories = ["gui", "wasm", "web-programming"]
include = ["/build.rs", "/locales", "/src", "/style", "/README.md"]
links = "sockel"

[package.metadata.trug]
dir = "style"
entry = "_index.scss"

[package.metadata.trug.gate]
actions = "action-group"
badges = "badge"
buttons = "button"
checkbox = "checkbox"
chip = "chip"
choice = "choice"
card-grid = "card-grid"
color-select = "color-select"
composer = "composer"
confirm = "confirm"
dialog = "overlay"
disclosure = "disclosure"
drop = "drop-zone"
fields = "field"
file-browser = "file-browser"
filter-picker = "picker"
heads = "head"
icons = "icons"
inputs = "input"
lanes = "lanes"
layout = "layout"
lightbox = "lightbox"
listbox = "select"
log-view = "log-view"
media = "media"
menu = "menu"
notices = "notice"
pager = "pager"
panel = "panel"
picker = "picker"
popover = "overlay"
property-list = "property-list"
quantity = "quantity"
reorder = "reorder"
rows = "rows"
save-bar = "save-bar"
seam = "seam"
shortcuts = "shortcuts"
search-select = "search-select"
select = "select"
shell = "shell"
skeleton = "skeleton"
split-view = "split-view"
stepper = "stepper"
switch = "switch"
table = "table"
tabs = "tabs"
time = "time"
toast = "toast"
toasts = "toasts"
toggles = "toggles"
tooltip = "tooltip"

[features]
default = ["full"]
full = ["action-group", "badge", "button", "card-grid", "checkbox", "chip", "chip-select", "choice", "color-select", "composer", "confirm", "disclosure", "drop-zone", "field", "file-browser", "head", "icons", "input", "lanes", "layout", "library-toolbar", "lightbox", "loadable", "log-view", "media", "menu", "notice", "overlay", "pager", "panel", "picker", "property-list", "quantity", "reorder", "rows", "save-bar", "seam", "search-select", "select", "shell", "shortcuts", "skeleton", "split-view", "stepper", "switch", "table", "tabs", "time", "toast", "toasts", "toggles", "tooltip"]
action-group = []
badge = ["icons"]
button = ["icons", "skeleton"]
card-grid = []
checkbox = ["icons"]
chip = ["icons"]
chip-select = ["chip", "layout", "search-select"]
choice = []
color-select = ["select"]
composer = ["drop-zone", "input"]
confirm = ["action-group", "badge", "button", "notice", "overlay"]
disclosure = ["head", "icons"]
drop-zone = ["button"]
field = []
file-browser = ["badge", "button", "field", "icons", "input", "layout", "notice", "overlay", "rows"]
head = ["layout"]
icons = []
input = ["icons"]
lanes = ["badge", "reorder"]
layout = []
library-toolbar = ["input", "layout"]
lightbox = ["overlay"]
loadable = ["notice", "skeleton"]
log-view = ["button"]
media = ["icons"]
menu = ["button", "icons", "overlay"]
notice = ["badge", "button"]
overlay = ["action-group", "button", "head", "icons"]
pager = ["icons"]
panel = []
picker = ["overlay", "pager", "select"]
property-list = ["button", "input"]
quantity = ["select", "stepper"]
reorder = ["icons", "rows", "tooltip"]
rows = ["button"]
save-bar = ["button"]
search-select = ["select"]
seam = []
select = ["input", "menu", "tooltip"]
shell = ["badge"]
shortcuts = ["overlay"]
skeleton = ["icons", "media"]
split-view = ["seam"]
stepper = ["input"]
switch = ["icons"]
table = ["icons"]
tabs = []
time = []
toast = ["save-bar", "toasts"]
toasts = ["badge", "button", "overlay"]
toggles = ["checkbox", "chip", "choice", "switch"]
tooltip = ["overlay"]

[dependencies]
js-sys = "0.3.77"
phrasebook02 = { package = "phrasebook", version = "0.2.0", features = ["yew023"] }
phrasebookcatalog01 = { package = "phrasebook-catalog", version = "0.1.0" }
wasm-bindgen = "0.2.100"
web-sys = { version = "0.3.77", features = ["AddEventListenerOptions", "BeforeUnloadEvent", "Blob", "console", "Clipboard", "ClipboardEvent", "CssStyleDeclaration", "DataTransfer", "DataTransferItem", "DataTransferItemList", "Document", "DomRect", "DomRectList", "DomTokenList", "DragEvent", "Element", "Event", "EventTarget", "File", "FileList", "FocusOptions", "HtmlCollection", "HtmlElement", "HtmlHeadElement", "HtmlInputElement", "HtmlTextAreaElement", "KeyboardEvent", "Navigator", "Node", "NodeList", "PointerEvent", "ResizeObserver", "ResizeObserverEntry", "ResizeObserverSize", "ScrollIntoViewOptions", "ScrollLogicalPosition", "Window"] }
yew = "0.23.0"

[build-dependencies]
sockel-build = { version = "0.3.2", path = "sockel-build" }

[dev-dependencies]
futures = "0.3"
sockel-build = { version = "0.3.2", path = "sockel-build" }
yew = { version = "0.23.0", features = ["ssr"] }

[workspace]
resolver = "3"
members = [".", "sockel-build", "sockel-build/fixture", "showcase"]
exclude = [".claude"]

[patch.crates-io]
sockel = { path = "." }
sockel-build = { path = "sockel-build" }
